behaviors:
  RocketLanding:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.02 #5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.9 #0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # curiosity:
      #   strength: 0.02
      #   gamma: 0.99
      #   learning_rate: 3.0e-4
    max_steps: 10000000
    checkpoint_interval: 500000  # 每 50 萬步存一個檔
    keep_checkpoints: 10         # 保留最近的 10 個存檔點
    time_horizon: 128
    summary_freq: 10000 #20000 